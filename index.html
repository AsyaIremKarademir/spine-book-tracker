<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spine — kitap günlüğün</title>
<meta name="description" content="Okuduğun, okumakta olduğun ve okumak istediğin kitapları takip et. Puanla, yorumla, raflarını düzenle.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Karla:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"> satırını <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- Kenar çubuğu -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">Spine</span>
      <span class="brand-sub">kitap günlüğün</span>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-view="home">
        <span class="nav-icon">◆</span> Akış
      </button>
      <button class="nav-item" data-view="search">
        <span class="nav-icon">◆</span> Kitap ara
      </button>
      <button class="nav-item" data-view="shelf" data-status="reading">
        <span class="nav-icon">◆</span> Okuyorum
      </button>
      <button class="nav-item" data-view="shelf" data-status="want">
        <span class="nav-icon">◆</span> Okumak istiyorum
      </button>
      <button class="nav-item" data-view="shelf" data-status="read">
        <span class="nav-icon">◆</span> Okudum
      </button>
      <button class="nav-item" data-view="stats">
        <span class="nav-icon">◆</span> İstatistikler
      </button>
    </nav>

    <div class="sidebar-footer">
      <button id="exportBtn" class="ghost-btn">Verini dışa aktar</button>
      <label class="ghost-btn" for="importInput">Veri içe aktar</label>
      <input type="file" id="importInput" accept="application/json" hidden>
    </div>
  </aside>

  <!-- Mobil üst çubuk -->
  <header class="mobile-bar">
    <span class="brand-mark">Spine</span>
    <button id="mobileMenuBtn" aria-label="Menüyü aç">☰</button>
  </header>

  <!-- Ana içerik -->
  <main class="content" id="content">
    <!-- JS ile dolduruluyor -->
  </main>

</div>

<!-- Kitap detay / günlük modalı -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="bookModal" role="dialog" aria-modal="true"></div>
</div>

<!-- Bildirim -->
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
